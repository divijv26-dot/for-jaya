<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>For Jaya ♥</title>

  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #fceff8, #eee5fa);
      font-family: Arial, sans-serif;
      color: #53384e;
      text-align: center;
    }

    .wrap {
      max-width: 650px;
      margin: auto;
      padding: 18px;
    }

    video {
      width: 100%;
      border-radius: 24px;
      box-shadow: 0 14px 40px #7b557733;
      background: #fff;
    }

    .card {
      margin: 18px 0 35px;
      background: #fffdfd;
      padding: 34px 20px;
      border-radius: 28px;
      box-shadow: 0 14px 40px #7b557733;
    }

    button {
      padding: 16px 32px;
      border: 0;
      border-radius: 18px;
      background: #edb9d6;
      color: #53384e;
      font-size: 21px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 7px 18px #b77c9b40;
    }

    #r {
      display: none;
      margin-top: 22px;
      font-size: 31px;
      font-weight: 700;
      animation: p .6s ease;
    }

    .small {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .h {
      position: fixed;
      font-size: 26px;
      animation: f 2s ease-out forwards;
      pointer-events: none;
    }

    @keyframes p {
      from {
        transform: scale(.3);
        opacity: 0;
      }
      70% {
        transform: scale(1.12);
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes f {
      to {
        transform: translateY(-220px) rotate(25deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

<div class="wrap">
  <div class="card">
    <h1>For Jaya ♥</h1>
    <p class="small">This is a special page just for you</p>
    <button onclick="showMessage()">Click Me ♥</button>
    <div id="r">You are amazing! 💕</div>
  </div>
</div>

<script>
  function showMessage() {
    const result = document.getElementById('r');
    result.style.display = 'block';
    
    // Create floating hearts
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        const heart = document.createElement('div');
        heart.className = 'h';
        heart.textContent = '♥';
        heart.style.left = Math.random() * 100 + '%';
        heart.style.top = '50%';
        heart.style.color = '#edb9d6';
        document.body.appendChild(heart);
        
        setTimeout(() => heart.remove(), 2000);
      }, i * 100);
    }
  }
</script>

</body>
</html>
